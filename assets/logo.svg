<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="shieldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="steelGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Heavy Steel Shield with Shutter Slats -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield Frame -->
    <path d="M24 2 L44 8 C44 26 34 40 24 46 C14 40 4 26 4 8 Z" fill="#0F172A" stroke="url(#shieldGradLight)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Roller Shutter Slats -->
    <rect x="11" y="13" width="26" height="3" rx="1" fill="#FFFFFF"/>
    <rect x="11" y="18" width="26" height="3" rx="1" fill="#FFFFFF"/>
    <rect x="11" y="23" width="26" height="3" rx="1" fill="#FFFFFF"/>
    <rect x="13" y="28" width="22" height="3" rx="1" fill="#F59E0B"/>
    <rect x="16" y="33" width="16" height="3" rx="1" fill="#F59E0B"/>
    
    <!-- Lock Accent -->
    <circle cx="24" cy="39" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography: Navy and Gold -->
  <text x="64" y="29" font-family="'Outfit', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1.2" fill="#0F172A">CAN <tspan fill="#D97706">KEPENK</tspan></text>
  <text x="65" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="2.2" fill="#64748B">OTOMATİK KEPENK SİSTEMLERİ</text>
</svg>
