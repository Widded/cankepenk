<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Shield with Shutter Slats -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield Frame -->
    <path d="M24 2 L44 8 C44 26 34 40 24 46 C14 40 4 26 4 8 Z" fill="#1E293B" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Roller Shutter Slats -->
    <rect x="10" y="13" width="28" height="3" rx="1" fill="url(#steelGrad)"/>
    <rect x="10" y="18" width="28" height="3" rx="1" fill="url(#steelGrad)"/>
    <rect x="10" y="23" width="28" height="3" rx="1" fill="url(#steelGrad)"/>
    <rect x="12" y="28" width="24" height="3" rx="1" fill="url(#steelGrad)"/>
    <rect x="15" y="33" width="18" height="3" rx="1" fill="url(#steelGrad)"/>
    
    <!-- Lock Accent -->
    <circle cx="24" cy="38" r="2" fill="#F59E0B"/>
  </g>

  <!-- Typography -->
  <text x="64" y="29" font-family="'Outfit', 'Inter', sans-serif" font-size="24" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">CAN <tspan fill="#F59E0B">KEPENK</tspan></text>
  <text x="65" y="44" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="2.8" fill="#94A3B8">OTOMATİK KEPENK SİSTEMLERİ</text>
</svg>
